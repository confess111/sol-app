<style>

<body><div id="app"></div>

<div id="im" style="position:fixed;inset:0;background:rgba(40,10,12,.4);display:none;align-items:center;justify-content:center;z-index:10">
  <div class="panel glass" style="width:100%;max-width:420px;border-radius:24px">

</div>
<script>
var VER='1.7',K='sol-v1',S={days:{},theme:'auto'};
/* 固定按北京时间（UTC+8）计算，不受设备时区影响 */
function bjShift(d){return new Date(d.getTime()+d.getTimezoneOffset()*60000+28800000);}

function loadFrom(r){var o=JSON.parse(r);if(!o||typeof o.days!=='object'||!o.days)throw 0;S=Object.assign(S,o)}
try{var r=localStorage.getItem(K);if(r){try{loadFrom(r)}catch(e){localStorage.setItem(K+'-bad',r);var ok=0;try{loadFrom(localStorage.getItem(K+'-prev'));ok=1}catch(e2){}if(!ok)try{var sn0=JSON.parse(localStorage.getItem(K+'-snap')||'{}'),sk0=Object.keys(sn0).sort();loadFrom(sn0[sk0[sk0.length-1]])}catch(e3){}}}}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function snap(j){try{var s=JSON.parse(localStorage.getItem(K+'-snap')||'{}');s[tk]=j;var ks=Object.keys(s).sort();while(ks.length>7)delete s[ks.shift()];localStorage.setItem(K+'-snap',JSON.stringify(s))}catch(e){}}
function save(){try{var j=JSON.stringify(S),p=localStorage.getItem(K);if(p&&p!==j)localStorage.setItem(K+'-prev',p);localStorage.setItem(K,j);snap(j)}catch(e){}}
var pad=function(n){return String(n).padStart(2,'0')},key=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},$=function(i){return document.getElementById(i)},fmt=function(k){return k.replace(/-/g,'.')},esc=function(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
var now=bjNow(),tk=key(now),view=new Date(now.getFullYear(),now.getMonth(),1),tab='home',cur=null,sel=[],draft=null;
var Q1=['Poco a poco. Little by little.','Hoy es un buen día. Today is a good day.','Un rato basta. A little while is enough.','Empieza ya. Start now.','Sin prisa, sin pausa. No rush, no stopping.','Tú puedes. You can do it.','Una palabra es un comienzo. One word is a start.','Vamos. Let’s go.'];
var Q2=['¡Muy bien! Very good!','¡Olé! Nice one.','Otro día más. One more day.','Eso es. That is it.','Bien hecho. Well done.','Mañana más. More tomorrow.','¡Genial! Great!','Sigue así. Keep it up.'];
var MS={10:'Diez. A real habit now.',25:'Veinticinco. Your ear is waking up.',50:'Cincuenta. ¡Increíble!',100:'Cien. ¡Qué orgullo!',150:'Ciento cincuenta. This is you now.',200:'Doscientos. ¡Imparable!'};
var W=[['la manzana','apple'],['el agua','water'],['gracias','thank you'],['por favor','please'],['la casa','house'],['el amigo','friend'],['comer','to eat'],['beber','to drink'],['hablar','to speak'],['aprender','to learn'],['la ciudad','city'],['feliz','happy'],['cansado','tired'],['mañana','tomorrow / morning'],['siempre','always'],['nunca','never'],['la playa','beach'],['el libro','book'],['la noche','night'],['el sol','sun'],['querer','to want / to love'],['la vida','life'],['bonito','pretty'],['despacio','slowly'],['la música','music'],['el café','coffee'],['dormir','to sleep'],['correr','to run'],['la sandía','watermelon'],['tímido','shy']];
var TG=['Words','Listening','Speaking','Grammar','Reading','Duolingo'];
var pick=function(a,o){return a[(Math.floor(now/864e5)+o)%a.length]};
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function cal(){
  var h='<div class="card glass"><div class="mh"><button class="sq glass" data-a="prev">‹</button><b>'+view.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</b><button class="sq glass" data-a="next">›</button></div><div class="grid">';
  h+=['L','M','X','J','V','S','D'].map(function(x){return '<div class="wd">'+x+'</div>'}).join('');
  var first=(view.getDay()+6)%7,dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(var i=0;i<first;i++)h+='<div class="d x"></div>';
  for(var n=1;n<=dim;n++){var k=view.getFullYear()+'-'+pad(view.getMonth()+1)+'-'+pad(n),v=S.days[k];
    h+='<button class="d'+(v?' has':'')+(k===tk?' today':'')+'" data-a="day" data-k="'+k+'">'+n+(v&&v.n?'<i></i>':'')+'</button>'}
  var old=Object.keys(S.days).length>=5&&(!S.lastBackup||Date.now()-S.lastBackup>12096e5);
  return h+'</div><div class="hint">Tap a day to add a note or log a past day</div></div>'+(old?'<div class="hint">Tip: tap Copy in Settings to keep a backup in Notes or Files.</div>':'')}
function home(){
  var t=Object.keys(S.days),mo=t.filter(function(k){return k.indexOf(tk.slice(0,7))===0}).length,has=!!S.days[tk],hr=now.getHours(),
  g=hr<12?['Buenos días','Good morning']:hr<20?['Buenas tardes','Good afternoon']:['Buenas noches','Good evening'],w=pick(W,0);
  return '<h1>Sol</h1><div class="date">'+now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</div>'+
  '<div class="card glass"><div class="row"><b>'+g[0]+'</b><span class="sub">'+g[1]+'</span></div><p class="sub" style="margin:8px 0 0">'+(has?pick(Q2,3):pick(Q1,0))+'</p>'+(has&&MS[t.length]?'<p style="margin:8px 0 0"><b>'+MS[t.length]+'</b></p>':'')+
  '<div class="stats"><div><b>'+t.length+'</b><span>Total</span></div><div><b>'+mo+'</b><span>This month</span></div></div><button class="main glass'+(has?' on':'')+'" data-a="main">'+(has?'Done today ✓':'I studied today')+'</button></div>'+
  '<div class="card glass"><span class="sub">Word of the day</span><div class="word">'+w[0]+'</div><div class="sub">'+w[1]+'</div></div>'+cal()}
function journal(){
  var ks=Object.keys(S.days).filter(function(k){return S.days[k].n}).sort().reverse(),h='<h1>Journal</h1><div class="date">'+ks.length+' note'+(ks.length===1?'':'s')+'</div>';
  if(!ks.length)return h+'<div class="card glass sub">Nothing here yet. One word or one sentence is plenty.</div>';
  return h+ks.map(function(k){var v=S.days[k];return '<button class="entry glass" data-a="day" data-k="'+k+'"><b>'+fmt(k)+'</b>'+(v.t&&v.t.length?'<div class="tg">'+v.t.join(' · ')+'</div>':'')+'<p>'+esc(v.n)+'</p></button>'}).join('')}
function settings(){
  return '<h1>Settings</h1><div class="date">Version '+VER+'</div>'+
  '<div class="card glass"><div class="row"><span>Appearance<br><span class="sub" style="font-size:12px">Auto follows your device</span></span><div class="pill glass">'+['auto','light','dark'].map(function(x){return '<button class="'+(S.theme===x?'on':'')+'" data-a="th" data-v="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</button>'}).join('')+'</div></div></div>'+
  '<div class="card glass"><div class="row"><span>Backup</span><div class="pill glass"><button data-a="bdown">⤓ 导出</button><button data-a="brest">↺ 导入</button></div></div><div class="hint" id="bm">Last backup: '+(S.lastBackup?fmt(key(bjShift(new Date(S.lastBackup)))):'never')+'</div></div>'+
  '<div class="card glass"><div class="row"><span>Get the latest version<br><span class="sub" style="font-size:12px">Your records stay on this device.</span></span><div class="pill glass"><button class="on" data-a="upg">Upgrade</button></div></div></div><div class="hint" style="margin-top:22px">Hecho con calma. Kept on this device.</div>'}
function sheet(){
  if(!cur)return '';var v=S.days[cur],t=draft!==null?draft:(v&&v.n)||'';
  return '<div class="veil" data-a="close"><div class="panel" data-a="stay"><div class="row"><b>'+fmt(cur)+'</b><button class="btn glass" data-a="close">Close</button></div><div class="chips">'+TG.map(function(x){return '<button class="chip glass'+(sel.indexOf(x)>-1?' on':'')+'" data-a="tag" data-v="'+x+'">'+x+'</button>'}).join('')+'</div><textarea id="nt" rows="3" placeholder="A word or a sentence from today">'+esc(t)+'</textarea><div class="row" style="margin-top:12px"><button class="btn glass" data-a="del">'+(v?'Remove day':'Cancel')+'</button><button class="btn glass on" data-a="save">Save</button></div></div></div>'}
function render(){try{renderMain()}catch(e){fail()}}
function renderMain(){
  $('app').innerHTML='<div id="in">'+(tab==='home'?home():tab==='journal'?journal():settings())+'</div>'+sheet();fit();
  $('bar').innerHTML=[['home','Home'],['journal','Journal'],['settings','Settings']].map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')}
function fail(){$('app').innerHTML='<div class="card glass"><b>Something went wrong.</b><p class="sub">Your records are safe. Tap Export to save a backup file, then tap Upgrade.</p><div class="row" style="margin-top:12px"><div class="pill glass"><button data-a="bdown">Export</button><button class="on" data-a="upg">Upgrade</button></div></div><div class="hint" id="bm"></div></div>'}
function fit(){try{document.documentElement.style.setProperty('--app-height',window.innerHeight+'px')}catch(e){}}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
function openDay(k){cur=k;sel=((S.days[k]&&S.days[k].t)||[]).slice();draft=null}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'stay':return;
    case 'tab':tab=v;cur=null;window.scrollTo(0,0);break;
    case 'prev':view=new Date(view.getFullYear(),view.getMonth()-1,1);break;
    case 'next':view=new Date(view.getFullYear(),view.getMonth()+1,1);break;
    case 'main':if(!S.days[tk]){S.days[tk]={n:'',t:[]};save()}else openDay(tk);break;
    case 'day':openDay(b.dataset.k);break;
    case 'close':cur=null;break;
    case 'tag':draft=$('nt').value;var i=sel.indexOf(v);if(i>-1)sel.splice(i,1);else sel.push(v);break;
    case 'save':S.days[cur]={n:$('nt').value.trim(),t:sel.slice()};save();cur=null;break;
    case 'del':if(S.days[cur]){delete S.days[cur];save()}cur=null;break;
    case 'th':S.theme=v;applyTheme();save();break;
    case 'brest':openImport();return;
    case 'bdown':exportBackup();return;
    case 'upg':b.textContent='Updating…';var go=function(){location.reload()};try{if(window.caches)caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(go,go);else go()}catch(x){go()}return;
  }
  render()});
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
/* backup/restore upgrade: gzip+base64 copy, json file download, manual-copy fallback, old-format compatible */
var TEMP_KEY='__bb_restore_tmp__';
function bbAll(){var m={},i,k;for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k!==TEMP_KEY)m[k]=localStorage.getItem(k);}return m;}
function bbSetMsg(t){var e=document.getElementById('bm');if(e)e.textContent=t;}
function bbSnap(){var s={},i,k;for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k!==TEMP_KEY)s[k]=localStorage.getItem(k);}try{localStorage.setItem(TEMP_KEY,JSON.stringify(s));}catch(e){}}
function backupName(){var d=bjNow();return 'Sol备份_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+'.json';}
function fmtSize(n){if(n>=1048576)return (n/1048576).toFixed(2)+' MB';return (n/1024).toFixed(1)+' KB';}
function exportBackup(){
  try{
    var m=bbAll(),n=Object.keys(S.days).length;
    var txt=JSON.stringify({format:'v2',exportedAt:new Date().toISOString(),counts:{days:n},data:m});
    var file=new File([txt],backupName(),{type:'application/json'});
    if(!(navigator.canShare&&navigator.canShare({files:[file]}))){doDownload(backupName());return;}
    var kb=fmtSize(file.size);
    navigator.share({files:[file],title:'Sol backup'}).then(function(){
      S.lastBackup=Date.now();save();
      bbSetMsg('共 '+n+' 条、'+kb+'。请在弹出的菜单选择【存储到文件】，之后在文件 App 核对大小是否为 '+kb);
    }).catch(function(e){
      if(e&&e.name==='AbortError'){bbSetMsg('已取消分享，未导出。');return;}
      bbSetMsg('导出失败：'+((e&&e.message)||e));
    });
  }catch(e){bbSetMsg('导出失败：'+((e&&e.message)||e));}
}
function doDownload(fn){try{var m=bbAll(),blob=new Blob([JSON.stringify(m,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fn||'backup.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},2000);bbSetMsg('已生成备份文件，可存到文件 App。');}catch(e){bbSetMsg('生成文件失败。');}}
function imHint(t,c){var e=document.getElementById('imhint');if(e){e.textContent=t||'';e.style.color=c||'var(--sub)';}}
function imStep(t){var e=document.getElementById('imstep');if(e)e.textContent=t||'';}
var imFile=null;
function openImport(){
  imFile=null;
  var fi=document.getElementById('imfile');if(fi)fi.value='';
  var sb=document.getElementById('imstart');if(sb)sb.style.display='none';
  var db=document.getElementById('imdone');if(db)db.style.display='none';

}
function closeImport(){document.getElementById('im').style.display='none';}
function parseBackup(raw){
  var o=JSON.parse(raw);
  if(!o||typeof o!=='object'||Array.isArray(o))return null;
  if(o.format==='v2'&&o.data&&typeof o.data==='object')return {data:o.data,counts:o.counts||null};
  var ks=Object.keys(o),i,allStr=true;
  for(i=0;i<ks.length;i++){if(typeof o[ks[i]]!=='string'){allStr=false;break;}}
  if(allStr&&ks.length)return {data:o,counts:null};
  if(o.days&&typeof o.days==='object'){
    var m={};m[K]=JSON.stringify({days:o.days,theme:o.theme||'auto'});
    return {data:m,counts:null};
  }
  return null;
}
function incomingDays(data){
  var raw=data[K];
  if(typeof raw==='string'){try{var o=JSON.parse(raw);if(o&&o.days&&typeof o.days==='object')return o.days;}catch(e){}}

  return null;
}
function importWrite(data){
  var k;

    if(k===TEMP_KEY)continue;
    try{localStorage.setItem(k,data[k]);}
    catch(e){
      if(e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22))throw new Error('存储空间不足');
      throw new Error('写入失败（'+k+'）：'+((e&&e.message)||e));
    }
  }
}
function tick(){return new Promise(function(r){setTimeout(r,0);});}
function runImport(file){
  var fail=function(t){imHint('导入失败：'+t,'#c62828');imStep('已有数据未改动，可以重新选择文件。');};
  try{
    imStep('读取中…');
    return tick().then(function(){return file.text();}).then(function(raw){
      if(!raw||!raw.trim()){fail('文件为空');return;}
      imStep('解析中…');
      return tick().then(function(){
        var p=null;
        try{p=parseBackup(raw);}catch(e){fail('不是有效的备份文件（JSON 解析失败）');return;}
        if(!p){fail('备份格式无法识别');return;}
        var inc=incomingDays(p.data);
        if(!inc){fail('备份里没有有效记录');return;}
        var warn='';
        if(p.counts&&typeof p.counts.days==='number'&&p.counts.days!==Object.keys(inc).length){
          warn='（警告：文件标注 '+p.counts.days+' 条，实际读到 '+Object.keys(inc).length+' 条）';
        }
        var cur=S.days,i,ov=[];
        for(i in inc){if(cur&&(i in cur))ov.push(i);}
        if(ov.length){
          var ow=confirm('有 '+ov.length+' 天已存在，确定=覆盖这些天，取消=保留已有、跳过这些天');
          if(!ow){
            var merged={},k2;
            for(k2 in cur)merged[k2]=cur[k2];
            for(k2 in inc){if(!(k2 in cur))merged[k2]=inc[k2];}
            var base=null;
            try{base=JSON.parse(p.data[K]);}catch(e){base=null;}
            if(!base||typeof base!=='object')base={days:{},theme:S.theme||'auto'};
            base.days=merged;
            var nd={},k3;for(k3 in p.data)nd[k3]=p.data[k3];
            nd[K]=JSON.stringify(base);
            p.data=nd;
          }
        }
        var expect=Object.keys(incomingDays(p.data)).length;
        imStep('写入中…');
        return tick().then(function(){
          try{bbSnap();}catch(e){}
          try{importWrite(p.data);}
          catch(e){
            var m=(e&&e.message)||String(e);
            if(m.indexOf('存储空间不足')>-1)fail('存储空间不足');else fail(m);
            return;
          }
          imStep('校验中…');
          return tick().then(function(){
            reloadState();
            var got=Object.keys(S.days).length;
            if(got!==expect){fail('校验数量不一致（预期 '+expect+' 条，实际 '+got+' 条）');return;}
            imHint('✅ 导入成功：'+got+' 条'+warn,'#2e7d32');
            imStep('点「完成」刷新页面');
            var sb=document.getElementById('imstart');if(sb)sb.style.display='none';
            var db=document.getElementById('imdone');if(db)db.style.display='';
          });
        });
      });
    }).catch(function(e){fail((e&&e.message)||String(e));});
  }catch(e){fail((e&&e.message)||String(e));return Promise.resolve();}
}
document.getElementById('impick').onclick=function(){document.getElementById('imfile').click();};
document.getElementById('imfile').onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  imFile=f;
  var sb=document.getElementById('imstart');if(sb)sb.style.display='';
  imHint('已选择：'+f.name+'（'+fmtSize(f.size)+'），点「开始导入」','#2e7d32');
  imStep('');
};
document.getElementById('imstart').onclick=function(){
  var b=this;
  if(!imFile){imHint('先选择一个备份文件');return;}
  b.disabled=true;
  runImport(imFile).then(function(){b.disabled=false;});
};
document.getElementById('imclose').onclick=closeImport;
document.getElementById('imdone').onclick=function(){location.reload();};
function reloadState(){var d=(K==='sol-v1')?{days:{},theme:'auto'}:{days:{},goal:4,theme:'auto'};try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r);if(o&&o.days)S=Object.assign(d,o);}}catch(e){}if(S.days)Object.keys(S.days).forEach(function(k){var v=S.days[k];if(Array.isArray(v)||typeof v!=='object'||!v)S.days[k]={n:''};});}
applyTheme();render();
</script></body></html>
